# Properties file with MongoDB settings.
#
# Applied by <context:property-placeholder location="classpath:spring/data-access.properties"/>
# from the application context XML files. Targeted at system administrators, to avoid touching
# the context XML files.
#
# The value can be overridden with the -Dmongodb.uri=... JVM option or the MONGODB_URI
# environment variable (e.g. mongodb://mongo:27017/petclinic?replicaSet=rs0 in docker-compose).
# Transactions (@Transactional) require MongoDB to run as a replica set.
mongodb.uri=${mongodb.uri}
